    function App() {
      const [activeTab, setActiveTab] = useState('catalog'); 
      const [selectedSubject, setSelectedSubject] = useState('All');
      const [selectedApp, setSelectedApp] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [toastMessage, setToastMessage] = useState('');
      const [toastType, setToastType] = useState('success');

      const [sandboxPrompt, setSandboxPrompt] = useState('');
      const [chatMessages, setChatMessages] = useState([
        { 
          sender: 'assistant', 
          text: 'Howdy Bear! 🐾 Welcome to the Grizzly Safe AI Lab. Select any prompt gem from our catalog and hit "Test in Sandbox", or query me below. I am configured with strict school-appropriate, homework-assistance safety filters!' 
        }
      ]);
      const [userInput, setUserInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      // DROPDOWN PROMPT BUILDER STATES
      const [builderRole, setBuilderRole] = useState('Math Tutor');
      const [builderTask, setBuilderTask] = useState('help me solve standard math homework problems');
      const [builderConstraint, setBuilderConstraint] = useState('do not give me the answer directly, instead ask me guiding questions to find it');
      const [builderTopic, setBuilderTopic] = useState('adding fractions with unlike denominators');
      const [builtPrompt, setBuiltPrompt] = useState('');

      const [hasSignedContract, setHasSignedContract] = useState(false);
      const [studentName, setStudentName] = useState('');

      const chatEndRef = useRef(null);

      // Effect to assemble the multi-step prompt in real-time
      useEffect(() => {
        const rolePart = builderRole ? `Act as a helpful ${builderRole}. ` : '';
        const taskPart = builderTask ? `Your task is to ${builderTask} ` : '';
        const constraintPart = builderConstraint ? `using this constraint: ${builderConstraint}. ` : '';
        const topicPart = builderTopic ? `Let's work together on: [${builderTopic}].` : '';
        setBuiltPrompt(`${rolePart}${taskPart}${constraintPart}${topicPart}`);
      }, [builderRole, builderTask, builderConstraint, builderTopic]);

      const showToast = (message, type = 'success') => {
        setToastMessage(message);
        setToastType(type);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleCopyText = (text) => {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('Prompt copied! Ready to paste in ClassLink.');
        } catch (err) {
          showToast('Could not copy automatically. Please copy manually!', 'error');
        }
        document.body.removeChild(textArea);
      };

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const handleTryInSandbox = (prompt) => {
        setSandboxPrompt(prompt);
        setUserInput(prompt);
        setActiveTab('sandbox');
        showToast('Prompt loaded! Replace placeholders in [ ] and hit send.');
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!userInput.trim()) return;

        const userMsg = userInput;
        setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setUserInput('');
        setIsGenerating(true);

        const systemPrompt = `
          You are Sparky, the official Bastrop ISD Grizzly AI Learning Assistant. 
          Your goals are to help middle schoolers (grades 6, 7, 8) safely learn, brainstorm, and improve.
          CRITICAL SAFETY DIRECTIVES:
          1. NEVER write full essays, reports, or homework answers for the student. If they ask you to write a paper or solve a math question directly, you must decline politely and guide them through how to do it themselves instead.
          2. Keep responses brief, encouraging, and highly accessible to 12-14 year olds. Use bullet points and simple analogies.

                  <h2 className="text-xl font-bold text-[#0B2240] flex items-center gap-1.5 mb-1">
                    <Icons.Sliders />
                    <span>Anatomy of a Prompt Builder: Grizzly Student Edition</span>
                  </h2>
                  <p className="text-xs text-slate-500">The best way to get safe, useful answers from AI is to construct your prompt carefully using four building blocks.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  
                  {/* Build Stage Controls */}
                  <div className="space-y-4">
                    <h3 className="font-bold text-sm text-[#6B1426] uppercase tracking-wider mb-2">Step 1: Fill in the Prompt Blocks</h3>

                    {/* Block 1: Role */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">👑 1. The Role (Who is the AI pretending to be?)</label>
                      <select 
                        value={builderRole}
                        onChange={(e) => setBuilderRole(e.target.value)}
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-[#6B1426]"
                      >
                        <option value="Math Tutor">Encouraging Middle School Math Tutor</option>
                        <option value="Writing Coach">Friendly Paragraph Writing Coach</option>
                        <option value="Science Guide">Excited Science Analogy Maker</option>
                        <option value="History Guide">Living History Guide from the 1800s</option>
                        <option value="Art Assistant">Creative Art Brainstormer</option>
                      </select>
                    </div>

                    {/* Block 2: Task */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">🎯 2. The Task (What do you want it to do?)</label>
                      <input 
                        type="text"
                        value={builderTask}
                        onChange={(e) => setBuilderTask(e.target.value)}
                        placeholder="e.g. help me plan my science experiment steps"
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-[#6B1426]"
                      />
                    </div>

                    {/* Block 3: Constraint */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">🛡️ 3. The Constraint (How should the AI behave safely?)</label>
                      <select 
                        value={builderConstraint}
                        onChange={(e) => setBuilderConstraint(e.target.value)}
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-[#6B1426]"
                      >
                        <option value="do not give me the answer directly, instead ask me guiding questions to find it">Socratic Mode (Ask questions, don't give direct answers)</option>
                        <option value="keep vocabulary easy and use a funny metaphor or story to explain">Simplified Mode (Explain with basic terms and funny analogies)</option>
                        <option value="make bullet points and keep your total response under 100 words">Brief Outline (Very short responses in bullets)</option>
                        <option value="suggest 3 options and ask me to choose my favorite">Choice Board (Present options and let me select)</option>
                      </select>
                    </div>

                    {/* Block 4: Topic */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">📖 4. The Topic (Your exact homework / subject concept)</label>
                      <input 
                        type="text"
                        value={builderTopic}
                        onChange={(e) => setBuilderTopic(e.target.value)}
                        placeholder="e.g. why cells divide"
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-[#6B1426]"
                      />
                    </div>
                  </div>

                  {/* Real-time Built Output with Grizzly design details */}
                  <div className="bg-[#0B2240] text-white rounded-2xl p-5 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-3.5">
                        <span className="text-[#e2c1c6] font-bold text-xs uppercase tracking-widest block">🔮 Live Prompt Blueprint</span>
                        <span className="bg-[#6B1426] text-white text-[10px] px-2 py-0.5 rounded">Autocreated</span>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 break-words leading-relaxed min-h-[140px]">
                        {builtPrompt}
                      </div>

                      <div className="mt-4 space-y-2 text-xs text-slate-300">
                        <p className="flex items-center space-x-1.5">
                          <span className="w-2 h-2 rounded-full bg-[#6B1426] inline-block"></span>
                          <span>Role: <strong className="text-white">{builderRole}</strong></span>
                        </p>
                        <p className="flex items-center space-x-1.5">
                          <span className="w-2 h-2 rounded-full bg-[#e2c1c6] inline-block"></span>
                          <span>Task: <strong className="text-white">"{builderTask}"</strong></span>
                        </p>
                        <p className="flex items-center space-x-1.5">
                          <span className="w-2 h-2 rounded-full bg-teal-500 inline-block"></span>
                          <span>Safety Guard: <strong className="text-white">"{builderConstraint.substring(0, 30)}..."</strong></span>
                        </p>
                      </div>
                    </div>

                    {/* Prompt Builder CTA Buttons */}
                    <div className="mt-6 pt-4 border-t border-slate-800 grid grid-cols-2 gap-3">
                      <button 
                        onClick={() => handleCopyText(builtPrompt)}
                        className="bg-white/10 hover:bg-white/15 text-white font-bold p-2.5 rounded-xl text-xs transition-colors flex items-center justify-center space-x-1"
                      >
                        <Icons.Copy size={13} />
                        <span>Copy Built Prompt</span>
                      </button>
                      <button 
                        onClick={() => handleTryInSandbox(builtPrompt)}
                        className="bg-[#6B1426] hover:bg-[#4C0E1B] text-white font-bold p-2.5 rounded-xl text-xs transition-transform hover:-translate-y-0.5 flex items-center justify-center space-x-1 shadow-md"
                      >
                        <Icons.Terminal size={13} />
                        <span>Try in Sandbox</span>
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* ----------------- TAB: SAFETY CONTRACT ----------------- */}
            {activeTab === 'safety' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm max-w-md mx-auto text-center">
                <span className="text-[#6B1426] mx-auto block mb-2"><Icons.Lock size={32} /></span>
                <h2 className="text-lg font-bold text-[#0B2240]">Bastrop ISD Safe AI Use Pledge</h2>
                <p className="text-xs text-slate-600 mt-2 leading-relaxed font-medium">
                  I pledge to use district AI resources to spark ideas and optimize learning, keeping private data safe and citing assistance transparently. Go Grizzlies!
                </p>
                <input 
                  type="text" 
                  placeholder="Type Your Name to Sign" 
                  value={studentName} 
                  onChange={(e) => setStudentName(e.target.value)} 
                  className="w-full text-xs border border-slate-200 rounded-xl p-2.5 mt-4 text-center shadow-sm focus:outline-none focus:ring-2 focus:ring-[#6B1426]" 
                />
                <button 
                  onClick={() => setHasSignedContract(true)} 
                  className="w-full bg-[#6B1426] hover:bg-[#4C0E1B] text-white font-bold p-2.5 rounded-xl text-xs mt-3 transition-all shadow-md"
                >
                  Submit Digital Oath 🐾
                </button>
              </div>
            )}

          </main>

          {/* Footer with deep blue background */}
          <footer className="bg-[#0B2240] text-slate-400 py-8 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-4">
              <p className="text-xs">
                © 2026 Bastrop ISD Educational Technology Services. This is an official Grizzly Bear learning sandbox built in accordance with Texas Education Agency guidance.
              </p>
              <div className="flex justify-center space-x-6 text-xs font-semibold">
                <a href="https://launchpad.classlink.com/login" target="_blank" rel="noopener noreferrer" className="hover:text-white">
                  BISD ClassLink
                </a>
                <span className="text-slate-700">|</span>
                <button onClick={() => setActiveTab('safety')} className="hover:text-white">
                  Responsible AI Policy
                </button>
                <span className="text-slate-700">|</span>
                <a href="https://www.bisdtx.org" target="_blank" rel="noopener noreferrer" className="hover:text-white">
                  Bastrop ISD Home
                </a>
              </div>
            </div>
          </footer>

          {/* Interactive Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#0B2240] text-white text-xs font-bold px-4 py-3 rounded-xl shadow-xl border border-slate-800 flex items-center space-x-2 animate-bounce">
              {toastType === 'success' ? (
                <Icons.Check />
              ) : (
                <Icons.AlertCircle size={16} />
              )}
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
