    function App() {
      const [activeTab, setActiveTab] = useState('catalog'); // catalog, sandbox, builder, safety
      const [selectedSubject, setSelectedSubject] = useState('All');
      const [selectedApp, setSelectedApp] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [toastMessage, setToastMessage] = useState('');
      const [toastType, setToastType] = useState('success');

      const [sandboxPrompt, setSandboxPrompt] = useState('');
      const [chatMessages, setChatMessages] = useState([
        { 
          sender: 'assistant', 
          text: 'Howdy Bear/Eagle! 🐾 Welcome to your Safe AI Testing Lab. Choose any prompt from our Subject Library and click "Test in Safe Sandbox", or type your own assignment question below! I am locked into school-safe student tutoring mode.' 
        }
      ]);
      const [userInput, setUserInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const [builderRole, setBuilderRole] = useState('Math Tutor');
      const [builderTask, setBuilderTask] = useState('help me solve standard math homework problems');
      const [builderConstraint, setBuilderConstraint] = useState('do not give me the answer, instead ask me guiding questions');
      const [builderTopic, setBuilderTopic] = useState('adding fractions with unlike denominators');
      const [builtPrompt, setBuiltPrompt] = useState('');

      const [hasSignedContract, setHasSignedContract] = useState(false);
      const [studentName, setStudentName] = useState('');

      const chatEndRef = useRef(null);

      useEffect(() => {
        const rolePart = builderRole ? `Act as a helpful ${builderRole}. ` : '';
        const taskPart = builderTask ? `Your task is to ${builderTask} ` : '';
        const constraintPart = builderConstraint ? `using this constraint: ${builderConstraint}. ` : '';
        const topicPart = builderTopic ? `Let's work together on: [${builderTopic}].` : '';
        setBuiltPrompt(`${rolePart}${taskPart}${constraintPart}${topicPart}`);
      }, [builderRole, builderTask, builderConstraint, builderTopic]);

      const showToast = (message, type = 'success') => {
        setToastMessage(message);
        setToastType(type);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleCopyText = (text) => {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('Prompt copied to clipboard! Ready to paste in your BISD ClassLink Apps.');
        } catch (err) {
          showToast('Could not copy automatically. Please copy manually!', 'error');
        }
        document.body.removeChild(textArea);
      };

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const handleTryInSandbox = (prompt) => {
        setSandboxPrompt(prompt);
        setUserInput(prompt);
        setActiveTab('sandbox');
        showToast('Prompt loaded into sandbox! Modify the placeholders inside [ ] then hit send.');
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!userInput.trim()) return;

        const userMsg = userInput;
        setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setUserInput('');
        setIsGenerating(true);

        const systemPrompt = `
          You are Sparky, the official Bastrop ISD Middle School AI Learning Assistant. 
          Your goals are to help middle schoolers (grades 6, 7, 8) safely learn, brainstorm, and improve.
          
          CRITICAL SAFETY DIRECTIVES:
          1. NEVER write full essays, reports, or homework answers for the student. If they ask you to write a paper or solve a math question directly, you must decline politely and guide them through how to do it themselves instead.
          2. Keep responses brief, encouraging, and highly accessible to 12-14 year olds. Use bullet points and simple analogies.
          3. Enforce strict school-appropriate language. Block and politely redirect if the student talks about weapons, self-harm, hate speech, material elements, or requests instructions for unsafe activities.
          4. If the student has loaded a prompt with brackets (e.g. "[Insert Topic]"), help them realize they need to replace the placeholder brackets with their actual school assignment topics.
          5. Encourage them to verify facts in their Bastrop ISD textbooks or ask their teacher if unsure.

                        className="text-[10px] font-bold text-amber-900 underline hover:text-amber-950"
                      >
                        View Safety Rules
                      </button>
                    </div>
                  </div>

                </div>

                {/* Right Sandbox Column: Safe Chat Sandbox */}
                <div className="lg:col-span-2 flex flex-col bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden min-h-[480px]">
                  
                  {/* Chat Header */}
                  <div className="bg-slate-900 text-white px-5 py-4 flex items-center justify-between">
                    <div className="flex items-center space-x-2.5">
                      <div className="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></div>
                      <div>
                        <h3 className="font-bold text-sm">Safe Prompt Assistant Sandbox</h3>
                        <p className="text-[10px] text-slate-400">ClassLink Pre-Flight Sandbox</p>
                      </div>
                    </div>
                    <span className="text-[10px] uppercase font-mono tracking-wider px-2 py-0.5 rounded bg-blue-800 text-blue-200">
                      Local Secure Mode
                    </span>
                  </div>

                  {/* Messages Board */}
                  <div className="flex-grow p-4 md:p-5 overflow-y-auto space-y-4 max-h-[360px] bg-slate-50/50">
                    {chatMessages.map((msg, index) => (
                      <div 
                        key={index} 
                        className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                      >
                        <div className={`max-w-[85%] rounded-2xl p-3.5 text-xs ${
                          msg.sender === 'user' 
                            ? 'bg-blue-900 text-white rounded-tr-none' 
                            : 'bg-white text-slate-800 border border-slate-200 shadow-sm rounded-tl-none whitespace-pre-wrap leading-relaxed'
                        }`}>
                          <div className="font-bold text-[10px] mb-1 text-slate-400 uppercase tracking-widest flex items-center gap-1">
                            {msg.sender === 'user' ? (
                              <>
                                <Icons.Star size={10} />
                                <span>My Prompt</span>
                              </>
                            ) : (
                              <>
                                <Icons.Sparkles />
                                <span>Sparky AI Assistant</span>
                              </>
                            )}
                          </div>
                          <div>{msg.text}</div>
                        </div>
                      </div>
                    ))}
                    {isGenerating && (
                      <div className="flex justify-start">
                        <div className="bg-white border border-slate-200 rounded-2xl rounded-tl-none p-4 text-xs text-slate-500 shadow-sm flex items-center space-x-2">
                          <div className="flex space-x-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce"></span>
                            <span className="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce delay-100"></span>
                            <span className="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce delay-200"></span>
                          </div>
                          <span>Sparky is thinking...</span>
                        </div>
                      </div>
                    )}
                    <div ref={chatEndRef}></div>
                  </div>

                  {/* Message Input Board */}
                  <form onSubmit={handleSendMessage} className="p-4 border-t border-slate-200 bg-white">
                    
                    {/* Active prompt loaded warning banner */}
                    {sandboxPrompt && (
                      <div className="mb-2 bg-amber-50 border border-amber-200 rounded-lg p-2 flex items-center justify-between text-[11px] text-amber-800">
                        <span className="truncate">Loaded: <strong>"{sandboxPrompt.substring(0, 50)}..."</strong></span>
                        <button 
                          type="button" 
                          onClick={() => setSandboxPrompt('')}
                          className="font-bold text-red-500 hover:text-red-700 ml-2"
                        >
                          Clear
                        </button>
                      </div>
                    )}

                    <div className="flex items-center space-x-2">
                      <textarea
                        rows={2}
                        value={userInput}
                        onChange={(e) => setUserInput(e.target.value)}
                        placeholder="Modify the loaded prompt or type a custom question (e.g. 'Help me brainstorm an intro paragraph for a history paper on Alamo')"
                        className="flex-grow bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            handleSendMessage(e);
                          }
                        }}
                      />
                      <button
                        type="submit"
                        className="bg-blue-900 hover:bg-blue-800 text-white disabled:bg-slate-200 disabled:text-slate-400 p-3.5 rounded-xl transition-colors shadow-sm shrink-0"
                      >
                        <Icons.Send />
                      </button>
                    </div>
                    <div className="mt-2 text-[10px] text-slate-400 flex items-center justify-between">
                      <span>Press Enter to send</span>
                      <span className="text-amber-600 font-bold">🐾 Safe Learning Mode Enabled</span>
                    </div>
                  </form>
                </div>

              </div>
            )}


            {/* ----------------- TAB: CUSTOM PROMPT BUILDER ----------------- */}
            {activeTab === 'builder' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm max-w-4xl mx-auto">
                <div className="border-b border-slate-100 pb-4 mb-6">
                  <h2 className="text-xl font-bold text-slate-900 flex items-center space-x-2">
                    <Icons.Sliders size={22} />
                    <span>Anatomy of a Perfect Prompt: Student Edition</span>
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    The best way to get safe, useful answers from AI is to construct your prompt carefully using four building blocks.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  
                  {/* Build Stage Controls */}
                  <div className="space-y-4">
                    <h3 className="font-bold text-sm text-slate-800 uppercase tracking-wider mb-2">
                      Step 1: Fill in the Prompt Blocks
                    </h3>

                    {/* Block 1: Role */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        👑 1. The Role (Who is the AI pretending to be?)
                      </label>
                      <select 
                        value={builderRole}
                        onChange={(e) => setBuilderRole(e.target.value)}
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="Math Tutor">Encouraging Middle School Math Tutor</option>
                        <option value="Writing Coach">Friendly Paragraph Writing Coach</option>
                        <option value="Science Guide">Excited Science Analogy Maker</option>
                        <option value="History Guide">Living History Guide from the 1800s</option>
                        <option value="Art Assistant">Creative Art Brainstormer</option>
                      </select>
                    </div>

                    {/* Block 2: Task */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        🎯 2. The Task (What do you want it to do?)
                      </label>
                      <input 
                        type="text"
                        value={builderTask}
                        onChange={(e) => setBuilderTask(e.target.value)}
                        placeholder="e.g. help me plan my science experiment steps"
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    {/* Block 3: Constraint */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        🛡️ 3. The Constraint (How should the AI behave safely?)
                      </label>
                      <select 
                        value={builderConstraint}
                        onChange={(e) => setBuilderConstraint(e.target.value)}
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="do not give me the answer directly, instead ask me guiding questions to find it">
                          Socratic Mode (Ask questions, don't give direct answers)
                        </option>
                        <option value="keep vocabulary easy and use a funny metaphor or story to explain">
                          Simplified Mode (Explain with basic terms and funny analogies)
                        </option>
                        <option value="make bullet points and keep your total response under 100 words">
                          Brief Outline (Very short responses in bullets)
                        </option>
                        <option value="suggest 3 options and ask me to choose my favorite">
                          Choice Board (Present options and let me select)
                        </option>
                      </select>
                    </div>

                    {/* Block 4: Topic */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        📖 4. The Topic (Your exact homework / subject concept)
                      </label>
                      <input 
                        type="text"
                        value={builderTopic}
                        onChange={(e) => setBuilderTopic(e.target.value)}
                        placeholder="e.g. why cells divide"
                        className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                  </div>

                  {/* Real-time Built Output */}
                  <div className="bg-slate-900 text-white rounded-2xl p-5 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-3.5">
                        <span className="text-amber-400 font-bold text-xs uppercase tracking-widest block">
                          🔮 Live Prompt Blueprint
                        </span>
                        <span className="bg-blue-800 text-blue-200 text-[10px] px-2 py-0.5 rounded">
                          Autocreated
                        </span>
                      </div>

                      <div className="bg-slate-850 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 break-words leading-relaxed min-h-[140px]">
                        {builtPrompt}
                      </div>

                      <div className="mt-4 space-y-2 text-xs text-slate-400">
                        <p className="flex items-center space-x-1.5">
                          <span className="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>
                          <span>Role: <strong className="text-white">{builderRole}</strong></span>
                        </p>
                        <p className="flex items-center space-x-1.5">
                          <span className="w-2 h-2 rounded-full bg-teal-500 inline-block"></span>
                          <span>Task: <strong className="text-white">"{builderTask}"</strong></span>
                        </p>
                        <p className="flex items-center space-x-1.5">
                          <span className="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                          <span>Safety Lock: <strong className="text-white">"{builderConstraint.substring(0, 30)}..."</strong></span>
                        </p>
                      </div>
                    </div>

                    {/* Prompt Builder CTA Buttons */}
                    <div className="mt-6 pt-4 border-t border-slate-800 grid grid-cols-2 gap-3">
                      <button 
                        onClick={() => handleCopyText(builtPrompt)}
                        className="bg-white/10 hover:bg-white/15 text-white font-bold p-2.5 rounded-xl text-xs transition-colors flex items-center justify-center space-x-1"
                      >
                        <Icons.Copy size={13} />
                        <span>Copy Built Prompt</span>
                      </button>
                      <button 
                        onClick={() => handleTryInSandbox(builtPrompt)}
                        className="bg-amber-400 hover:bg-amber-500 text-blue-950 font-bold p-2.5 rounded-xl text-xs transition-transform hover:-translate-y-0.5 flex items-center justify-center space-x-1 shadow-md"
                      >
                        <Icons.Terminal size={13} />
                        <span>Try in Sandbox</span>
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}


            {/* ----------------- TAB: SAFETY CONTRACT ----------------- */}
            {activeTab === 'safety' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm max-w-2xl mx-auto">
                <div className="text-center pb-6 border-b border-slate-100">
                  <span className="text-amber-500 mx-auto mb-2 block">
                    <Icons.Lock size={32} />
                  </span>
                  <h2 className="text-xl font-extrabold text-blue-950">
                    Bastrop ISD Safe AI Use Contract
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    Because Bears and Eagles always explore new tech with integrity and responsibility!
                  </p>
                </div>

                <div className="py-6 space-y-4">
                  <div className="flex items-start space-x-3.5">
                    <span className="text-2xl mt-0.5">🛡️</span>
                    <div>
                      <h3 className="font-bold text-sm text-slate-900">1. Protect Your Privacy</h3>
                      <p className="text-xs text-slate-600 mt-1">
                        Never input your real address, full name, phone number, password, or any private student record details into any AI prompt box.
                      </p>
                    </div>
                  </div>

                  <div className="flex items-start space-x-3.5">
                    <span className="text-2xl mt-0.5">🧠</span>
                    <div>
                      <h3 className="font-bold text-sm text-slate-900">2. Use AI as a Spark, Not a Cheat</h3>
                      <p className="text-xs text-slate-600 mt-1">
                        AI is here to help you outline, get unstuck, brainstorm analogies, and check formatting. Do not submit AI outputs directly as your original class work.
                      </p>
                    </div>
                  </div>

                  <div className="flex items-start space-x-3.5">
                    <span className="text-2xl mt-0.5">🔍</span>
                    <div>
                      <h3 className="font-bold text-sm text-slate-900">3. Double-Check Information</h3>
                      <p className="text-xs text-slate-600 mt-1">
                        AI can make mistakes (hallucinate). Always cross-reference crucial historical facts, dates, or complex equations with your school textbook or ask your teacher.
                      </p>
                    </div>
                  </div>

                  <div className="flex items-start space-x-3.5">
                    <span className="text-2xl mt-0.5">📝</span>
                    <div>
                      <h3 className="font-bold text-sm text-slate-900">4. Always Cite Your Help</h3>
                      <p className="text-xs text-slate-600 mt-1">
                        Be proud of how you learn! Tell your teacher if AI helped you brainstorm or proofread, just like you would mention if a study buddy helped you.
                      </p>
                    </div>
                  </div>
                </div>

                {/* Signature Form */}
                <div className="bg-slate-50 border border-slate-100 rounded-2xl p-5">
                  {hasSignedContract ? (
                    <div className="text-center space-y-2">
                      <span className="inline-block bg-emerald-100 text-emerald-800 font-extrabold text-xs uppercase px-2.5 py-1 rounded-full">
                        Pledge Active
                      </span>
                      <h4 className="font-bold text-slate-900 text-base">
                        ✨ Thank you, {studentName}!
                      </h4>
                      <p className="text-xs text-slate-500 max-w-sm mx-auto">
                        You have successfully pledged to use Artificial Intelligence ethically in Bastrop ISD. Bring this digital badge to your classroom!
                      </p>
                    </div>
                  ) : (
                    <form onSubmit={handleSignContract} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Type Your Name to Sign the Integrity Contract:
                        </label>
                        <input 
                          type="text"
                          required
                          value={studentName}
                          onChange={(e) => setStudentName(e.target.value)}
                          placeholder="e.g. Charlie Bear or Taylor Eagle"
                          className="w-full text-xs bg-white border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold p-3 rounded-xl text-xs transition-transform hover:-translate-y-0.5 shadow-md flex items-center justify-center space-x-1.5"
                      >
                        <Icons.CheckCircle2 size={14} />
                        <span>Submit Safety Digital Oath</span>
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-4">
              <p className="text-xs">
                © 2026 Bastrop ISD Educational Technology Services. This is a private learning sandbox constructed in accordance with Texas Education Agency guidance and BISD Digital Citizenship criteria.
              </p>
              <div className="flex justify-center space-x-6 text-xs font-semibold">
                <a href="https://launchpad.classlink.com/login" target="_blank" rel="noopener noreferrer" className="hover:text-white">
                  BISD ClassLink
                </a>
                <span className="text-slate-700">|</span>
                <button onClick={() => setActiveTab('safety')} className="hover:text-white">
                  Responsible AI Policy
                </button>
                <span className="text-slate-700">|</span>
                <a href="https://www.bisdtx.org" target="_blank" rel="noopener noreferrer" className="hover:text-white">
                  Bastrop ISD Home
                </a>
              </div>
            </div>
          </footer>

          {/* Interactive Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-xl border border-slate-800 flex items-center space-x-2 animate-bounce">
              {toastType === 'success' ? (
                <Icons.Check />
              ) : (
                <Icons.AlertCircle size={16} />
              )}
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
